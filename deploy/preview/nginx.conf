# Publish ONLY preview/ on a separate credential-free registrable domain.
# Replace both exact origins here and the parent origin in review.html atomically.
worker_processes auto;
pid /tmp/brokerrouter-preview-nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server { listen 8443 ssl default_server; ssl_reject_handshake on; return 421; }
    server {
        listen 8443 ssl;
        server_name review.example-media.invalid;
        ssl_certificate /etc/brokerrouter/tls/fullchain.pem;
        ssl_certificate_key /etc/brokerrouter/tls/privkey.pem;
        root /srv/brokerrouter/preview;
        if ($host != review.example-media.invalid) { return 421; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($args != "") { return 400; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://console.example.invalid; sandbox allow-scripts" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), fullscreen=(), autoplay=()" always;
        location = /review.html { try_files $uri =404; }
        location = /review.js { try_files $uri =404; }
        location = /review.css { try_files $uri =404; }
        location / { return 404; }
    }
}
