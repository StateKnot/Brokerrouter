# Same-host production edge. Replace the exact DNS name and provision certificate
# files outside this repository. BFF must bind to 127.0.0.1:8087 on this host.
# Only console/dist is published; never mount the repository or runtime assets.
worker_processes auto;
pid /tmp/brokerrouter-console-nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format metadata escape=json '{"request":"$request_id","method":"$request_method","status":$status,"seconds":$request_time}';
    access_log /dev/stdout metadata;
    limit_conn_zone $binary_remote_addr zone=console_clients:10m;
    limit_req_zone $binary_remote_addr zone=console_queries:10m rate=10r/s;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    large_client_header_buffers 4 8k;
    reset_timedout_connection on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
        return 421;
    }
    server {
        listen 8443 ssl;
        server_name console.example.invalid;
        ssl_certificate /etc/brokerrouter/tls/fullchain.pem;
        ssl_certificate_key /etc/brokerrouter/tls/privkey.pem;
        root /srv/brokerrouter/console;
        limit_conn console_clients 16;
        limit_conn_status 429;
        limit_req_status 429;
        # Host is independently pinned; unknown Host/SNI is not an application origin.
        if ($host != console.example.invalid) { return 421; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # Replace the exact preview origin together with the BFF preview configuration.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self'; frame-src https://review.example-media.invalid; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        location = / { try_files /index.html =404; }
        location = /index.html { try_files /index.html =404; }
        location ~ ^/assets/[a-zA-Z0-9_.-]+\.(js|css|woff2)$ { try_files $uri =404; }
        location ^~ /bff/v1/ {
            # Never log callback query strings, Cookie, Authorization or upstream bodies.
            # Nginx error messages can include the raw request URI; disable them here.
            error_log /dev/null;
            limit_req zone=console_queries burst=20 nodelay;
            proxy_pass http://127.0.0.1:8087;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # Origin, Sec-Fetch-Site, Cookie, CSRF and Authorization are NOT synthesized:
            # pass them unchanged for the BFF to verify/reject, including duplicate values.
            proxy_redirect off;
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 45s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_cache off;
        }
        location / { return 404; }
    }
}
