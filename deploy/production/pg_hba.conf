# Local access exists only inside the dedicated database container. Anyone able
# to exec there already controls the database files; network clients still use TLS/SCRAM.
local   all             all                                     trust
# Every network connection, including the private Docker network, requires TLS and SCRAM.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
