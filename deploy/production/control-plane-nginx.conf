user nginx;
worker_processes 1;
pid /tmp/control-plane-nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16m;
    client_body_buffer_size 16k;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 45s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;
    limit_conn_zone $binary_remote_addr zone=control_clients:1m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_certificate /run/secrets/tls_fullchain;
    ssl_certificate_key /run/secrets/tls_private_key;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 45s;
    proxy_read_timeout 45s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    server { listen 8443 ssl default_server; ssl_reject_handshake on; return 421; }
    server {
        listen 8443 ssl;
        server_name control.brokerrouter.internal;
        if ($host != control.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://control:8081; }
    }
    server {
        listen 8443 ssl;
        server_name assets.brokerrouter.internal;
        if ($host != assets.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://assets:8082; }
    }
    server {
        listen 8443 ssl;
        server_name media-api.brokerrouter.internal;
        if ($host != media-api.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://media-api:8083; }
    }
    server {
        listen 8443 ssl;
        server_name output-scan.brokerrouter.internal;
        if ($host != output-scan.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://output-scan:8084; }
    }
    server {
        listen 8443 ssl;
        server_name output-delivery.brokerrouter.internal;
        if ($host != output-delivery.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://output-delivery:8085; }
    }
    server {
        listen 8443 ssl;
        server_name console.brokerrouter.internal;
        if ($host != console.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://console:8086; }
    }
    server {
        listen 8443 ssl;
        server_name catalog.brokerrouter.internal;
        if ($host != catalog.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://catalog:8088; }
    }
    server {
        listen 8443 ssl;
        server_name settings.brokerrouter.internal;
        if ($host != settings.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://settings:8089; }
    }
    server {
        listen 8443 ssl;
        server_name approvals.brokerrouter.internal;
        if ($host != approvals.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://approvals:8090; }
    }
    server {
        listen 8443 ssl;
        server_name media-review.brokerrouter.internal;
        if ($host != media-review.brokerrouter.internal) { return 421; }
        limit_conn control_clients 16;
        limit_conn_status 429;
        # Error messages can contain callback/resource identifiers. Never log requests.
        error_log /dev/null;
        location / { proxy_pass http://media-review:8091; }
    }
}
