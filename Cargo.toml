[package]
name = "brokerrouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
default-run = "brokerrouter"
description = "Governed multi-provider AI gateway with durable CNY accounting"

[dependencies]
anyhow = "1.0.98"
aes-gcm = "0.10.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive", "env"] }
rand = "0.9.1"
rsa = "0.9"
object_store = { version = "=0.13.2", default-features = false, features = ["aws", "tls-webpki-roots"] }
openidconnect = { version = "=4.0.1", default-features = false }
bytes = "1"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["auth", "client", "transport-streamable-http-client-reqwest"] }
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
sse-stream = "=0.2.6"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "signal", "net", "time", "process", "io-util"] }
tokio-util = {version="0.7",features=["rt"]}
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
base64 = "0.22"
async-trait = "0.1"
http-body-util = "0.1"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
