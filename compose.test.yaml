name: brokerrouter-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brokerrouter
      POSTGRES_PASSWORD: brokerrouter-local-only
      POSTGRES_DB: brokerrouter
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerrouter"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  minio:
    profiles: [assets]
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: brokerrouter-test-only
      MINIO_ROOT_PASSWORD: brokerrouter-local-only-not-production
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /data
