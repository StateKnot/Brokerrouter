name: Hermes native governance contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hermes-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: 67764dc0863349a384c16425e73ee8571f3a94b7
          path: hermes-upstream
          sparse-checkout: |
            agent/tool_executor.py
            gateway/run_turn.py
            gateway/run_turn_runner.py
            model_tools.py
            tools/registry.py
            gateway/platforms/base.py
            gateway/run_voice.py
            gateway/delivery_ledger.py
            agent/agent_runtime_helpers.py
            agent/turn_api_call.py
            agent/turn_final_response.py
            agent/turn_finalizer.py
            agent/session_persistence.py
            agent/stream_delivery.py
            gateway/session_lifecycle.py
            agent/auxiliary_client.py
            agent/title_generator.py
            agent/chat_completion_helpers.py
            gateway/run_inbound.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Install Hermes-pinned adapter dependencies
        run: python -m pip install --disable-pip-version-check --no-input cryptography==50.0.0 httpx==0.28.1
      - name: Verify adapter dependency graph
        run: python -m pip check
      - name: Adapter state-machine and installer contracts
        env:
          PYTHONPATH: adapters/hermes
          BROKERROUTER_HERMES_SOURCE: ${{ github.workspace }}/hermes-upstream
        run: python -m unittest discover -s adapters/hermes/tests -v
      - name: Fixed Hermes source and overlay contract
        run: |
          mkdir -p /tmp/hermes-contract/agent /tmp/hermes-contract/gateway/platforms /tmp/hermes-contract/tools
          cp hermes-upstream/agent/tool_executor.py /tmp/hermes-contract/agent/tool_executor.py
          cp hermes-upstream/gateway/run_turn.py /tmp/hermes-contract/gateway/run_turn.py
          cp hermes-upstream/gateway/run_turn_runner.py /tmp/hermes-contract/gateway/run_turn_runner.py
          cp hermes-upstream/model_tools.py /tmp/hermes-contract/model_tools.py
          cp hermes-upstream/tools/registry.py /tmp/hermes-contract/tools/registry.py
          cp hermes-upstream/gateway/platforms/base.py /tmp/hermes-contract/gateway/platforms/base.py
          cp hermes-upstream/gateway/run_voice.py /tmp/hermes-contract/gateway/run_voice.py
          cp hermes-upstream/gateway/delivery_ledger.py /tmp/hermes-contract/gateway/delivery_ledger.py
          cp hermes-upstream/agent/agent_runtime_helpers.py /tmp/hermes-contract/agent/agent_runtime_helpers.py
          cp hermes-upstream/agent/turn_api_call.py /tmp/hermes-contract/agent/turn_api_call.py
          cp hermes-upstream/agent/turn_final_response.py /tmp/hermes-contract/agent/turn_final_response.py
          cp hermes-upstream/agent/turn_finalizer.py /tmp/hermes-contract/agent/turn_finalizer.py
          cp hermes-upstream/agent/session_persistence.py /tmp/hermes-contract/agent/session_persistence.py
          cp hermes-upstream/agent/stream_delivery.py /tmp/hermes-contract/agent/stream_delivery.py
          cp hermes-upstream/gateway/session_lifecycle.py /tmp/hermes-contract/gateway/session_lifecycle.py
          cp hermes-upstream/agent/auxiliary_client.py /tmp/hermes-contract/agent/auxiliary_client.py
          cp hermes-upstream/agent/title_generator.py /tmp/hermes-contract/agent/title_generator.py
          cp hermes-upstream/agent/chat_completion_helpers.py /tmp/hermes-contract/agent/chat_completion_helpers.py
          cp hermes-upstream/gateway/run_inbound.py /tmp/hermes-contract/gateway/run_inbound.py
          echo '1610a0893588cbc067aaf84b3d019a683cd83ba0fdb92d69baf4f7b9e6d121b9  /tmp/hermes-contract/agent/tool_executor.py' | sha256sum --check --strict
          echo 'dd203228bdfb7f69f1442adf4e24cc7e3196fb348b096ab6e7c2cb2bd2af5214  /tmp/hermes-contract/gateway/run_turn.py' | sha256sum --check --strict
          echo '9bfa045616264e944b417ce3bfe0e302168c7b6d0218ceeb253b2dad2629e4ba  /tmp/hermes-contract/gateway/run_turn_runner.py' | sha256sum --check --strict
          echo '875512e422e3e0d1502f7f7e127d47288bf1f1b350b4442ad5fc210e526b3f67  /tmp/hermes-contract/model_tools.py' | sha256sum --check --strict
          echo 'ca02644ea36dfa08ab7e12893d283a3b12549a5ffd33ea72c29c632a94e7b201  /tmp/hermes-contract/tools/registry.py' | sha256sum --check --strict
          echo '14f2bcd915e97ecb2d14cae290e1dc07d36c3247ac9b7599f38c3175670ec52a  /tmp/hermes-contract/gateway/platforms/base.py' | sha256sum --check --strict
          echo '236853144929c0165f766c9c44927c8acb0c2e575776b68b8a5f6dd0f9e8651f  /tmp/hermes-contract/gateway/run_voice.py' | sha256sum --check --strict
          echo 'b2656cd6429fb848f8df405fd7bb5e50f2ea6cb0620141c59ccccc3f7c314ab7  /tmp/hermes-contract/gateway/delivery_ledger.py' | sha256sum --check --strict
          echo '328f3f8ee5e6956ae530007ec0c22457e3bb681b6125c918cd43ea7124b1767e  /tmp/hermes-contract/agent/agent_runtime_helpers.py' | sha256sum --check --strict
          echo '5dead01b498131df2ee987e431ded73ca21313ef1a52633e9aa802efc2aa00b5  /tmp/hermes-contract/agent/turn_api_call.py' | sha256sum --check --strict
          echo 'ff414924aa9ffc30fb64b91a602f4621307f22a9f6e5aa3f88e916eabbadbce1  /tmp/hermes-contract/agent/turn_final_response.py' | sha256sum --check --strict
          echo '4b79fa4eeb325095b4664df6085df54385d0f38cb6e610c6145c91680f46badd  /tmp/hermes-contract/agent/turn_finalizer.py' | sha256sum --check --strict
          echo '83ee5c9f48a7790deb3f771e45990180e1fd714c7b1fabc24303944f17773a1b  /tmp/hermes-contract/agent/session_persistence.py' | sha256sum --check --strict
          echo '38d3fda9b9ab09048c14154588e30fa695db89db20efb06fdeb6ffdbf00721c3  /tmp/hermes-contract/agent/stream_delivery.py' | sha256sum --check --strict
          echo 'fc8a17d5dd5cbc40fd51abf2b4c75b6c5dd5c1bf1cecbd5f7f4deea8e1f58071  /tmp/hermes-contract/gateway/session_lifecycle.py' | sha256sum --check --strict
          echo 'ca46e494e1e518ca793c65c3b4707ae2f3f38c27ee142b2076ff050978d1065b  /tmp/hermes-contract/agent/auxiliary_client.py' | sha256sum --check --strict
          echo '1eb801e5f020bb9f32373ed52afb68ab64e384618649260fdf82b12370c13d4b  /tmp/hermes-contract/agent/title_generator.py' | sha256sum --check --strict
          echo '2e5308b231ac50cb52b90439f17d7a5e05618d46dd23cffcf45cafb5d77e3073  /tmp/hermes-contract/agent/chat_completion_helpers.py' | sha256sum --check --strict
          echo 'd20049510d55674bb60d20cb48f09b71f829880850467b18a9c55a8188e2f9f5  /tmp/hermes-contract/gateway/run_inbound.py' | sha256sum --check --strict
          python adapters/hermes/install.py --source /tmp/hermes-contract
          python adapters/hermes/install.py --source /tmp/hermes-contract --apply
          python adapters/hermes/install.py --source /tmp/hermes-contract
          python -m py_compile \
            /tmp/hermes-contract/agent/tool_executor.py \
            /tmp/hermes-contract/gateway/run_turn.py \
            /tmp/hermes-contract/gateway/run_turn_runner.py \
            /tmp/hermes-contract/model_tools.py \
            /tmp/hermes-contract/tools/registry.py \
            /tmp/hermes-contract/gateway/platforms/base.py \
            /tmp/hermes-contract/gateway/run_voice.py \
            /tmp/hermes-contract/gateway/delivery_ledger.py \
            /tmp/hermes-contract/agent/agent_runtime_helpers.py \
            /tmp/hermes-contract/agent/turn_api_call.py \
            /tmp/hermes-contract/agent/turn_final_response.py \
            /tmp/hermes-contract/agent/turn_finalizer.py \
            /tmp/hermes-contract/agent/session_persistence.py \
            /tmp/hermes-contract/agent/stream_delivery.py \
            /tmp/hermes-contract/gateway/session_lifecycle.py \
            /tmp/hermes-contract/agent/auxiliary_client.py \
            /tmp/hermes-contract/agent/title_generator.py \
            /tmp/hermes-contract/agent/chat_completion_helpers.py \
            /tmp/hermes-contract/gateway/run_inbound.py \
            /tmp/hermes-contract/brokerrouter_hermes/*.py
          PYTHONPATH=/tmp/hermes-contract \
            BROKERROUTER_HERMES_GOVERNANCE=required \
            BROKERROUTER_BASE_URL=https://gateway.example \
            BROKERROUTER_HERMES_APPROVALS_URL=https://console.example \
            BROKERROUTER_VIRTUAL_KEY=sk_br_1111111111111111111111111111111111111111111111111111111111111111 \
            BROKERROUTER_HERMES_STATE_DB=/tmp/brokerrouter/governance.db \
            BROKERROUTER_HERMES_STATE_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
            python -c 'from brokerrouter_hermes import verify_runtime_installation; verify_runtime_installation()'
