name: Console browser and edge contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm exec -- playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Actual Nginx edge contract
        run: |
          docker pull nginx:stable-alpine
          export BROKERROUTER_TEST_NGINX_IMAGE="$(docker image inspect nginx:stable-alpine --format '{{index .RepoDigests 0}}')"
          node tests/edge.mjs
          node tests/preview-edge.mjs
