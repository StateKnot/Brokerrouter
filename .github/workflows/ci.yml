name: Rust quality and PostgreSQL contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brokerrouter
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: brokerrouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brokerrouter"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://brokerrouter:test-only@localhost:5432/brokerrouter
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
